name: Build Binary

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary (No Test)
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -v -trimpath -ldflags="-s -w" -o vocat ./cmd/vocat
          ls -lh vocat

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocat-linux-amd64
          path: vocat
